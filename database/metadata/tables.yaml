- table:
    schema: public
    name: organizations
  configuration:
    custom_name: organizations
  array_relationships:
    - name: members
      using:
        foreign_key_on: org_id
        table:
          schema: public
          name: org_members
    - name: workflows
      using:
        foreign_key_on: org_id
        table:
          schema: public
          name: workflows
    - name: credentials
      using:
        foreign_key_on: org_id
        table:
          schema: public
          name: api_credentials
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - name
          - quota_limit
          - quota_used
          - quota_period
          - quota_reset_at
          - created_at
          - updated_at
        filter:
          id:
            _in:
              X-Hasura-User-Id: ""
            _or:
              - members:
                  user_id:
                    _eq: X-Hasura-User-Id
        allow_aggregations: true

- table:
    schema: public
    name: org_members
  configuration:
    custom_name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_on: org_id
        table:
          schema: public
          name: organizations
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - user_id
          - org_id
          - role
          - created_at
        filter:
          user_id:
            _eq: X-Hasura-User-Id

- table:
    schema: public
    name: workflows
  configuration:
    custom_name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_on: org_id
        table:
          schema: public
          name: organizations
  array_relationships:
    - name: steps
      using:
        foreign_key_on: workflow_id
        table:
          schema: public
          name: workflow_steps
    - name: triggers
      using:
        foreign_key_on: workflow_id
        table:
          schema: public
          name: workflow_triggers
    - name: runs
      using:
        foreign_key_on: workflow_id
        table:
          schema: public
          name: workflow_runs
    - name: variables
      using:
        foreign_key_on: workflow_id
        table:
          schema: public
          name: workflow_variables
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - name
          - description
          - status
          - current_version
          - created_by
          - created_at
          - updated_at
          - deleted_at
        filter:
          deleted_at:
            _is_null: true
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - org_id
          - name
          - description
          - status
          - created_by
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - description
          - status
          - current_version
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor

